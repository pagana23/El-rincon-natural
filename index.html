<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>El Rincón Natural</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="El Rincón Natural" class="logo"/>
    <h1>El Rincón Natural</h1>
    <p>Frutas y verduras frescas en Paraná</p>
  </header>

  <div class="registro">
    <button onclick="registrarUsuario()">Registrarme</button>
    <button onclick="modoInvitado()">Ingresar como invitado</button>
  </div>

  <div class="envio">
    <label>¿Cómo querés recibir tu pedido?</label><br>
    <select onchange="seleccionarEnvio(this.value)">
      <option value="retiro">Retiro en local</option>
      <option value="envio">Envío a domicilio</option>
    </select>
  </div>

  <div id="productos" class="productos"></div>

  <footer>
    <p>© El Rincón Natural - 2025</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
